version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: universal-dns-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: universal_dns_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dns-hub-network

  # Universal DNS Hub 应用
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: universal-dns-hub
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      # 数据库配置（需要根据实际情况修改）
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/universal_dns_hub
      # 加密密钥（必须设置为固定值，否则每次重启都会变化）
      - ENCRYPTION_KEY=your-256-bit-encryption-key-here-change-this
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dns-hub-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local

networks:
  dns-hub-network:
    driver: bridge
