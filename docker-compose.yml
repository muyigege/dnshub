version: '3.8'

services:
  # Universal DNS Hub 应用（使用 SQLite，无需额外数据库）
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dnshub
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=file:/app/data/local.sqlite
      - ENCRYPTION_KEY=your-256-bit-encryption-key-here-change-this
    volumes:
      - dnshub_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  dnshub_data:
    driver: local
